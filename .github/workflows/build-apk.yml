name: Build Sorna Educational Group Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Sorna Educational Group)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          echo "Using Android SDK at: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Verify & Prepare Sorna Android Project Structure
        run: |
          rm -rf src-tauri/gen/android/app/src/main/java/com
          rm -rf src-tauri/gen/android/app/src/main/res/drawable
          mkdir -p src-tauri/gen/android/app/src/main/java/ir/sornac/app
          mkdir -p src-tauri/gen/android/app/src/main/res/drawable-nodpi
          mkdir -p src-tauri/gen/android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p src-tauri/gen/android/app/src/main/res/values
          mkdir -p src-tauri/gen/android/app/src/main/res/xml

          base64 -d << 'EOF' > src-tauri/gen/android/app/src/main/res/drawable-nodpi/ic_launcher_logo.png
