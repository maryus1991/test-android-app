name: Build Amvaj Sarmad Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Tauri 2 & Android Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Dist Assets
        run: npm run build

      - name: Make Gradle Executable
        run: |
          cd src-tauri/gen/android
          chmod +x gradlew || gradle wrapper
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd src-tauri/gen/android
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK
        run: |
          cd src-tauri/gen/android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amvaj-sarmad-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amvaj-sarmad-release-apk
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk
